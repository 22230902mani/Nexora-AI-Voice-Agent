services:
  - type: web
    name: nexora-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: nexora-db
    databaseName: nexora
    user: nexora
    plan: free
    region: oregon
    ipAllowList: []
